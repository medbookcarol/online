name: Publicar Caderno de Trauma (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'ficha23.html'
      - 'ficha24.html'
      - 'ficha25.html'
      - 'ficha26.html'
      - 'ficha27.html'
      - 'ficha28.html'
      - 'ficha29.html'
      - 'ficha30.html'
      - 'ficha31.html'
      - 'assets/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Criar pacote do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
