name: Cache Tema 21 radiology images
on:
  push:
    paths:
      - '.github/workflows/cache-theme21-images.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cache-radiology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download CC BY figures from official PMC AWS Open Data service
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.parse,xml.etree.ElementTree as ET,re,pathlib,sys,json
          host="https://pmc-oa-opendata.s3.amazonaws.com/"
          version="PMC10722344.1/"
          def get(url):
            req=urllib.request.Request(url,headers={"User-Agent":"MedbookCarol-ScientificImageResearch/1.0"})
            with urllib.request.urlopen(req,timeout=35) as res:return res.read()
          path=host+"?list-type=2&prefix="+urllib.parse.quote(version)
          xml=get(path).decode()
          root=ET.fromstring(xml)
          ns={"s":"http://s3.amazonaws.com/doc/2006-03-01/"}
          keys=[x.text for x in root.findall(".//s:Contents/s:Key",ns)]
          print("S3 KEYS:",keys)
          if not keys:sys.exit("No files at article version")
          output=pathlib.Path("assets/tema21/exames");output.mkdir(parents=True,exist_ok=True)
          choices={1:"fig01_xray",2:"fig02_ct",3:"fig03_mri",5:"fig05_postop"}
          count=0
          for n,name in choices.items():
            hits=[key for key in keys if re.search(r"(?:-i|_i|f)0?"+str(n)+r"\.(?:jpg|jpeg|png|gif|webp)$",key,re.I)]
            if not hits:
              print("MISSING",n);continue
            key=hits[0];b=get(host+urllib.parse.quote(key,safe="/"))
            ext=pathlib.Path(key).suffix.lower()
            if len(b)<4000:continue
            filename=name+ext
            (output/filename).write_bytes(b)
            print("SAVED",filename,len(b),key)
            count+=1
          if count<3:sys.exit("Missing three usable figures")
          PY
      - name: Commit verified local image files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/tema21/exames
          if ! git diff --cached --quiet; then
            git commit -m "Host Tema 21 scientific CT MRI images locally"
            git push
          fi
