name: Cache Tema 21 radiology images
on:
  push:
    paths:
      - '.github/workflows/cache-theme21-images.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cache-radiology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official PMC open-access article package and extract figures
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.parse, tarfile, io, re, pathlib, xml.etree.ElementTree as ET, sys
          article="PMC10722344"
          api="https://www.ncbi.nlm.nih.gov/pmc/utils/oa/oa.fcgi?id="+article
          hdr={"User-Agent":"MedbookCarol-Citation-Research/1.0 (educational)","Accept":"*/*"}
          def download(url):
            with urllib.request.urlopen(urllib.request.Request(url,headers=hdr), timeout=45) as resp:
              return resp.read()
          xml=download(api).decode("utf-8")
          print("OA API:",xml[:550])
          root=ET.fromstring(xml)
          links=[x.attrib.get("href","") for x in root.findall(".//link") if x.attrib.get("format")=="tgz"]
          if not links: sys.exit("No PMC OA tgz URL")
          url=links[0].replace("ftp://ftp.ncbi.nlm.nih.gov/","https://ftp.ncbi.nlm.nih.gov/")
          print("OPEN PACKAGE",url)
          data=download(url)
          print("ARCHIVE BYTES",len(data))
          archive=tarfile.open(fileobj=io.BytesIO(data),mode="r:*")
          members=[m for m in archive.getmembers() if m.isfile() and re.search(r'\.(jpg|jpeg|png)$',m.name,re.I)]
          print("IMAGE FILES",[(m.name,m.size) for m in members][:40])
          out=pathlib.Path("assets/tema21/exames");out.mkdir(parents=True,exist_ok=True)
          good=[]
          targets={1:"fig01_xray",2:"fig02_ct",3:"fig03_mri",5:"fig05_postop"}
          for n,name in targets.items():
            candidates=[m for m in members if re.search(r'(?:i0?'+str(n)+r'|f0?'+str(n)+r')\.(jpg|jpeg|png)$',m.name,re.I)]
            if not candidates:
              print("MISSING",n);continue
            member=max(candidates,key=lambda m:m.size)
            b=archive.extractfile(member).read()
            if len(b)<5000:continue
            ext=pathlib.Path(member.name).suffix.lower()
            (out/(name+ext)).write_bytes(b)
            good.append(name+ext)
            print("STORED",name+ext,len(b))
          if len(good)<3:sys.exit("Could not extract at least 3 images")
          PY
      - name: Commit verified local image files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/tema21/exames
          if ! git diff --cached --quiet; then
            git commit -m "Host Tema 21 open access clinical CT MRI images within website"
            git push
          fi
