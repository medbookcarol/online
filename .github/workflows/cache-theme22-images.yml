name: Cache Tema 22 radiology figure atlas
on:
  push:
    paths:
      - '.github/workflows/cache-theme22-images.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve high-resolution peer-reviewed illustrations from PMC Open Access S3
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.parse,xml.etree.ElementTree as ET,re,pathlib,sys
          host="https://pmc-oa-opendata.s3.amazonaws.com/"
          articles={
            "PMC11563234":{1:"poplitea_ct_comparativo"},
            "PMC11240895":{1:"trauma_vascular_esquema",2:"trauma_vascular_fig2",3:"trauma_vascular_fig3",4:"trauma_vascular_fig4"},
            "PMC12606060":{1:"endovascular_fig1",2:"endovascular_fig2"}
          }
          out=pathlib.Path("assets/tema22/exames");out.mkdir(parents=True,exist_ok=True)
          def fetch(url):
            req=urllib.request.Request(url,headers={"User-Agent":"MedbookCarolTeachingAtlas/1.0"})
            with urllib.request.urlopen(req,timeout=35) as res:return res.read()
          count=0
          for article,figures in articles.items():
            try:
              url=host+"?list-type=2&prefix="+urllib.parse.quote(article+".1/")
              root=ET.fromstring(fetch(url))
              ns={"s":"http://s3.amazonaws.com/doc/2006-03-01/"}
              keys=[k.text for k in root.findall(".//s:Contents/s:Key",ns)]
              print("ARTICLE",article,"KEYS",keys[:40],flush=True)
              for num,name in figures.items():
                matches=[key for key in keys if re.search(r"(?:-i|_i|f)0?"+str(num)+r"\.(?:jpg|jpeg|png|webp)$",key,re.I)]
                if not matches:
                  print("FIG MISSING",article,num,flush=True);continue
                key=max(matches,key=lambda x:("large" in x.lower(),len(x)))
                dat=fetch(host+urllib.parse.quote(key,safe="/"))
                if len(dat)<4000:continue
                extension=pathlib.Path(key).suffix.lower()
                dest=out/(name+extension)
                dest.write_bytes(dat)
                print("SAVED",dest,len(dat),flush=True)
                count+=1
            except Exception as exc:
              print("SOURCE FAILED",article,str(exc),flush=True)
          if count<4:sys.exit("Insufficient radiology figures extracted")
          PY
      - name: Commit local images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/tema22/exames
          if ! git diff --cached --quiet; then
            git commit -m "Cache Tema 22 vascular trauma medical images locally"
            git push
          fi
