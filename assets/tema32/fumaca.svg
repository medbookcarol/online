<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 610"><rect width="960" height="610" rx="20" fill="#f2f7fa"/><text x="29" y="49" font-family="Arial" font-size="28" font-weight="bold" fill="#254c69">INALAÇÃO: TRÊS MECANISMOS SIMULTÂNEOS</text><rect x="30" y="84" width="900" height="97" rx="14" fill="#eaf2f7" stroke="#b4ccdc"/><text x="52" y="117" font-family="Arial" font-size="23" font-weight="bold" fill="#315c79">Calor em via aérea superior</text><text x="52" y="153" font-family="Arial" font-size="19" fill="#53738a">Edema progressivo, disfonia, estridor</text><rect x="30" y="202" width="900" height="97" rx="14" fill="#e1edf4" stroke="#b4ccdc"/><text x="52" y="235" font-family="Arial" font-size="23" font-weight="bold" fill="#315c79">Lesão química traqueobrônquica</text><text x="52" y="271" font-family="Arial" font-size="19" fill="#53738a">Broncoespasmo, secreções, pneumonite</text><rect x="30" y="320" width="900" height="97" rx="14" fill="#eaf2f7" stroke="#b4ccdc"/><text x="52" y="353" font-family="Arial" font-size="23" font-weight="bold" fill="#315c79">Monóxido de carbono (CO)</text><text x="52" y="389" font-family="Arial" font-size="19" fill="#53738a">COHb; SpO₂ convencional pode ser falsamente normal</text><rect x="30" y="438" width="900" height="97" rx="14" fill="#e1edf4" stroke="#b4ccdc"/><text x="52" y="471" font-family="Arial" font-size="23" font-weight="bold" fill="#315c79">Cianeto (HCN)</text><text x="52" y="507" font-family="Arial" font-size="19" fill="#53738a">Inibição citocromo oxidase → hipóxia celular/lactato</text><text x="30" y="587" font-family="Arial" font-size="16" fill="#658192">Caderno de Trauma — esquema original para revisão</text></svg>