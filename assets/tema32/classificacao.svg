<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 610"><rect width="960" height="610" rx="20" fill="#f2f7fa"/><text x="29" y="49" font-family="Arial" font-size="28" font-weight="bold" fill="#254c69">SOBRASA: RESGATE E GRAUS 1–6</text><rect x="30" y="84" width="900" height="97" rx="14" fill="#eaf2f7" stroke="#b4ccdc"/><text x="52" y="117" font-family="Arial" font-size="23" font-weight="bold" fill="#315c79">Resgate ou grau 1</text><text x="52" y="153" font-family="Arial" font-size="19" fill="#53738a">Sem sintomas ou tosse com ausculta normal</text><rect x="30" y="202" width="900" height="97" rx="14" fill="#e1edf4" stroke="#b4ccdc"/><text x="52" y="235" font-family="Arial" font-size="23" font-weight="bold" fill="#315c79">Grau 2 / 3</text><text x="52" y="271" font-family="Arial" font-size="19" fill="#53738a">Estertores em bases / edema pulmonar com pulso radial</text><rect x="30" y="320" width="900" height="97" rx="14" fill="#eaf2f7" stroke="#b4ccdc"/><text x="52" y="353" font-family="Arial" font-size="23" font-weight="bold" fill="#315c79">Grau 4</text><text x="52" y="389" font-family="Arial" font-size="19" fill="#53738a">Edema pulmonar com choque; pulso radial ausente</text><rect x="30" y="438" width="900" height="97" rx="14" fill="#e1edf4" stroke="#b4ccdc"/><text x="52" y="471" font-family="Arial" font-size="23" font-weight="bold" fill="#315c79">Graus 5 / 6</text><text x="52" y="507" font-family="Arial" font-size="19" fill="#53738a">Parada respiratória com pulso / parada cardiorrespiratória</text><text x="30" y="587" font-family="Arial" font-size="16" fill="#658192">Caderno de Trauma — esquema original para revisão</text></svg>