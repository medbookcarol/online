<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560"><rect width="900" height="560" rx="24" fill="#f4f8fb"/><text x="30" y="46" fill="#174663" font-family="Arial" font-size="28" font-weight="bold">CLASSIFICAÇÃO DAS LESÕES POR EXPLOSÃO</text><rect x="30" y="78" width="840" height="90" rx="13" fill="#eaf2f7" stroke="#bad0e2"/><text x="52" y="109" font-size="22" fill="#205d78" font-weight="bold" font-family="Arial">PRIMÁRIA — onda de pressão</text><text x="52" y="144" font-size="18" fill="#456980" font-family="Arial">Pulmão, ouvido, intestino, embolia gasosa</text><rect x="30" y="190" width="840" height="90" rx="13" fill="#e2edf6" stroke="#bad0e2"/><text x="52" y="221" font-size="22" fill="#205d78" font-weight="bold" font-family="Arial">SECUNDÁRIA — fragmentos e projéteis</text><text x="52" y="256" font-size="18" fill="#456980" font-family="Arial">Ferimentos penetrantes por estilhaços</text><rect x="30" y="302" width="840" height="90" rx="13" fill="#eaf2f7" stroke="#bad0e2"/><text x="52" y="333" font-size="22" fill="#205d78" font-weight="bold" font-family="Arial">TERCIÁRIA — deslocamento corporal</text><text x="52" y="368" font-size="18" fill="#456980" font-family="Arial">Impacto, fraturas, TCE, esmagamento</text><rect x="30" y="414" width="840" height="90" rx="13" fill="#e2edf6" stroke="#bad0e2"/><text x="52" y="445" font-size="22" fill="#205d78" font-weight="bold" font-family="Arial">QUATERNÁRIA — outros efeitos</text><text x="52" y="480" font-size="18" fill="#456980" font-family="Arial">Queimaduras, fumaça, tóxicos e soterramento</text><text x="30" y="542" fill="#6b8593" font-size="15" font-family="Arial">Esquema original · Caderno de Trauma · Ficha 31</text></svg>