<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 590"><rect width="940" height="590" fill="#fff9f4" rx="20"/><text x="30" y="50" font-family="Arial" font-weight="bold" font-size="29" fill="#823d20">ELETRICIDADE: A PELE NÃO MOSTRA TUDO</text><rect x="32" y="83" width="876" height="87" rx="12" fill="#f7eee7" stroke="#d9a681"/><text x="57" y="114" font-family="Arial" font-weight="bold" font-size="22" fill="#8c4227">Alta tensão ≥ 1.000 volts</text><text x="57" y="147" font-family="Arial" font-size="18" fill="#5f4e48">Consultar centro especializado em queimaduras</text><rect x="32" y="194" width="876" height="87" rx="12" fill="#fae9da" stroke="#d9a681"/><text x="57" y="225" font-family="Arial" font-weight="bold" font-size="22" fill="#8c4227">Dano muscular profundo</text><text x="57" y="258" font-family="Arial" font-size="18" fill="#5f4e48">Pode ser maior que lesão cutânea aparente</text><rect x="32" y="305" width="876" height="87" rx="12" fill="#f7eee7" stroke="#d9a681"/><text x="57" y="336" font-family="Arial" font-weight="bold" font-size="22" fill="#8c4227">Rabdomiólise</text><text x="57" y="369" font-family="Arial" font-size="18" fill="#5f4e48">CK, potássio, creatinina, diurese e ECG</text><rect x="32" y="416" width="876" height="87" rx="12" fill="#fae9da" stroke="#d9a681"/><text x="57" y="447" font-family="Arial" font-weight="bold" font-size="22" fill="#8c4227">Mão / membro constrito</text><text x="57" y="480" font-family="Arial" font-size="18" fill="#5f4e48">Diferenciar escarotomia e fasciotomia</text><text x="32" y="573" font-family="Arial" font-size="15" fill="#6d6760">Esquema didático original • Ficha 30 • Caderno de Trauma</text></svg>