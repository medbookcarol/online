<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520"><rect width="780" height="520" rx="22" fill="#fff8f2"/><text x="25" y="47" font-size="28" font-weight="bold" font-family="Arial" fill="#883e1e">MÉTODO PALMAR — ATLS 11</text><rect x="24" y="75" width="732" height="82" rx="12" fill="#fceadd" stroke="#e3bc9b"/><text x="44" y="104" font-size="21" font-weight="bold" font-family="Arial" fill="#8e4320">A referência é a mão do paciente</text><text x="44" y="136" font-size="18" font-family="Arial" fill="#5b514b">Face palmar + dedos fechados/juntos</text><rect x="24" y="171" width="732" height="82" rx="12" fill="#f7eee8" stroke="#e3bc9b"/><text x="44" y="200" font-size="21" font-weight="bold" font-family="Arial" fill="#8e4320">Aproximadamente 1% SCQ</text><text x="44" y="232" font-size="18" font-family="Arial" fill="#5b514b">Usar para placas pequenas ou irregulares</text><rect x="24" y="267" width="732" height="82" rx="12" fill="#fceadd" stroke="#e3bc9b"/><text x="44" y="296" font-size="21" font-weight="bold" font-family="Arial" fill="#8e4320">Mão toda ≠ apenas uma palma</text><text x="44" y="328" font-size="18" font-family="Arial" fill="#5b514b">Não duplicar com o cálculo do braço inteiro</text><rect x="24" y="363" width="732" height="82" rx="12" fill="#f7eee8" stroke="#e3bc9b"/><text x="44" y="392" font-size="21" font-weight="bold" font-family="Arial" fill="#8e4320">Somar sem eritema superficial</text><text x="44" y="424" font-size="18" font-family="Arial" fill="#5b514b">Lesões parciais e totais entram no cálculo</text><text x="24" y="508" font-family="Arial" font-size="14" fill="#786557">Ficha 30 • ATLS 11 • esquema educacional</text></svg>