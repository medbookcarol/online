<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 590"><rect width="900" height="590" rx="22" fill="#f3f7fb"/><text x="26" y="50" font-size="28" font-family="Arial" font-weight="bold" fill="#234b66">COAGULOPATIA PÓS-TRAUMÁTICA</text><rect x="25" y="81" width="850" height="92" rx="12" fill="#e7f0f7" stroke="#bad0e0"/><text x="44" y="114" font-size="22" font-family="Arial" font-weight="bold" fill="#2d627f">Hipotermia + acidose + coagulopatia</text><text x="44" y="149" font-size="18" font-family="Arial" fill="#526b7d">Tríade letal histórica; hipocalcemia também importa</text><rect x="25" y="195" width="850" height="92" rx="12" fill="#dfeaf4" stroke="#bad0e0"/><text x="44" y="228" font-size="22" font-family="Arial" font-weight="bold" fill="#2d627f">Transfusão maciça e citrato</text><text x="44" y="263" font-size="18" font-family="Arial" fill="#526b7d">Queda do cálcio ionizado → pior contração/coagulação</text><rect x="25" y="309" width="850" height="92" rx="12" fill="#e7f0f7" stroke="#bad0e0"/><text x="44" y="342" font-size="22" font-family="Arial" font-weight="bold" fill="#2d627f">Fibrinogênio, plaquetas e cálcio</text><text x="44" y="377" font-size="18" font-family="Arial" fill="#526b7d">Monitorar e corrigir com metas clínicas</text><rect x="25" y="423" width="850" height="92" rx="12" fill="#dfeaf4" stroke="#bad0e0"/><text x="44" y="456" font-size="22" font-family="Arial" font-weight="bold" fill="#2d627f">Controle definitivo da hemorragia</text><text x="44" y="491" font-size="18" font-family="Arial" fill="#526b7d">Não tratar apenas os exames</text><text x="26" y="574" font-size="15" font-family="Arial" fill="#6e8696">Ilustração original • Ficha 33 • Caderno de Trauma</text></svg>